<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d1a" />
    <title>FlowBridge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Applied before first paint so the page never flashes the wrong
      // theme while React hydrates — mirrors the logic in App.tsx.
      (function () {
        try {
          var saved = localStorage.getItem("flowbridge.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
